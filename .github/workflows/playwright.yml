name: Run Playwright Tests

on:
  push:
    branches:
      - feature/implementing-playwright  # Runs when pushing to playright branch for now

jobs:
  test:
    name: Run Playwright Tests on Feature Branch (Sequential)
    runs-on: ubuntu-24.04

    env:
          PLAYWRIGHT_USERNAME: ${{ secrets.PLAYWRIGHT_USERNAME}}
          PLAYWRIGHT_PASSWORD: ${{ secrets.PLAYWRIGHT_PASSWORD}}
          PLAYWRIGHT_OTP_KEY: ${{ secrets.PLAYWRIGHT_OTP_KEY}}
          PLAYWRIGHT_SHARE_URL: ${{ secrets.PLAYWRIGHT_SHARE_URL}}

    steps:
      - name: Checkout feature/implementing-playwright branch
        uses: actions/checkout@v4
        with:
          ref: feature/implementing-playwright  

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright system dependencies
        run: npx playwright install-deps

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Install OTPAuth
        run: npm install @otp-lib/authenticator @otp-lib/core

      - name: Run Playwright Test (with User Credentials)
        run: |
          npx playwright test \
            user-sixQ-createQuiz.spec.ts \
            --workers 1 \
            --timeout 180000 \
            --trace on \
            --output recapp/tests/e2e/test-report/user-test
        working-directory: tests/e2e/

      - name: Run Playwright Test (Anonymously)
        run: |
          npx playwright test \
            anon-sixQ-create-sc.spec.ts \
            --workers 1 \
            --timeout 180000 \
            --trace on \
            --output recapp/tests/e2e/test-report/anon-test 
        working-directory: tests/e2e/

      - name: Upload Test Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/test-report/
            tests/e2e/test-artifacts/
          if-no-files-found: warn
