# docker-compose.prod.yaml (Production configuration)

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  frontend:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: packages/frontend/Dockerfile
      args:
        - VITE_BACKEND_URI=${BACKEND_URI}
        - VITE_FRONTEND_URI=${FRONTEND_URI}
        - VITE_DEBUG_RECAPP=1 # change to 0 for production
    environment:
      - FRONTEND_URI=${FRONTEND_URI}
      - BACKEND_URI=${BACKEND_URI}
      - VITE_DEBUG_RECAPP=1 # change to 0 for production
    depends_on:
      - backend

  backend:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    build:
      context: ..
      dockerfile: packages/backend/Dockerfile
      args:
        - SERVER_PORT=${SERVER_PORT}
    environment:
      - NODE_ENV=production
      - FRONTEND_URI=${FRONTEND_URI}
      - BACKEND_URI=${BACKEND_URI}
      - SERVER_PORT=${SERVER_PORT}
      - SERVER_HOST=${SERVER_HOST}
      - OPENID_PROVIDER=${OPENID_PROVIDER}
      - OID_CLIENT_ID=${OID_CLIENT_ID}
      - OID_CLIENT_SECRET=${OID_CLIENT_SECRET}
      - ISSUER=${ISSUER}
      - REDIRECT_URI=${REDIRECT_URI}
      - REQUIRES_OFFLINE_SCOPE=${REQUIRES_OFFLINE_SCOPE}
      - API_KEYS=${API_KEYS}
      - MONGODB_HOST=recapp-db
      - MONGODB_PORT=${MONGODB_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - DEBUG_RECAPP=0 # change to 0 for prod

    depends_on:
      - recapp-db

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1450" # adjust to your indrastructure

volumes:
  caddy_data:
  caddy_config:
