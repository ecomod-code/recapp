version: 2
updates:
  # Application + tooling dependencies (npm workspaces are picked up from root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Bundle all non-major bumps into a single PR to cut review noise.
      # Major bumps still arrive as individual PRs.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Dev/build/monorepo tooling: suppress MAJOR-version PRs so they don't
      # flood the list. These are done deliberately, not via Dependabot; the
      # transitive vulns they carry are build-time only (not shipped in the
      # backend/frontend containers). Minor/patch still flow via the group above.
      - dependency-name: "lerna"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nx"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nx/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@manypkg/cli"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@featherscloud/pinion"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typedoc"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mongodb-memory-server"
        update-types: ["version-update:semver-major"]
      # Runtime/framework majors deliberately deferred (done as their own
      # migration, not via auto-PRs). NOT react-router — we want the eventual
      # fix for its RSC-CSRF advisory.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mongodb"
        update-types: ["version-update:semver-major"]
      - dependency-name: "koa"
        update-types: ["version-update:semver-major"]
      - dependency-name: "koa-session"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@koa/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zustand"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "js-yaml"
        update-types: ["version-update:semver-major"]
      - dependency-name: "itu-utils"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/*"
        update-types: ["version-update:semver-major"]
      # katex 0.x: hold minor/major (0.16 -> 0.18 is a breaking render change
      # and math rendering is core). Patch bumps (0.16.x) still flow.
      - dependency-name: "katex"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # App runtime libs: suppress MAJOR PRs. Each is a deliberate migration,
      # not an auto-merge (@lingui 4->6 is a coordinated cross-package move with
      # a deprecated macro; openid-client 5->6 is an auth-API rewrite; tsmonads,
      # rambda, serialize-error carry breaking API/ESM changes; uuid advisory is
      # non-applicable and peer-blocked). Minor/patch still flow via the group.
      - dependency-name: "@lingui/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "openid-client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tsmonads"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rambda"
        update-types: ["version-update:semver-major"]
      - dependency-name: "serialize-error"
        update-types: ["version-update:semver-major"]
      - dependency-name: "uuid"
        update-types: ["version-update:semver-major"]

  # Keep GitHub Actions used by the CI workflow up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
